# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefixo
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Splits
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded"

# Resize panes
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind -r m resize-pane -Z

# Mouse
set -g mouse on

# Historico de rolagem. O padrao do tmux e 2000 linhas, que uma sessao longa de
# agente enche em minutos e a partir dai o inicio e descartado em silencio.
# Custa memoria so pelo que e realmente usado, por painel.
set -g history-limit 50000

# Vi mode em copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Escape time para Neovim
set -sg escape-time 10

# Deixa o escape de clipboard (OSC 52) atravessar o tmux até o terminal.
# Sem isso, copiar no nvim de uma máquina remota não chega no clipboard local,
# mesmo com tudo certo do lado do nvim.
set -g set-clipboard on

# Começa índices em 1 (janelas e panes)
set -g base-index 1
set-window-option -g pane-base-index 1
# Reordena as janelas ao fechar uma, pra não deixar buracos na numeração
set -g renumber-windows on

##### PLUGINS #####
# Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-pain-control'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'fabioluciano/tmux-tokyo-night'

set -g @theme_variation 'storm'

# Config dos plugins
if-shell "uname | grep -q Darwin" \
  "set -g @theme_plugins 'datetime,homebrew'" \
  "set -g @theme_plugins 'datetime'"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Inicializa o TPM (deixe por último)
run-shell '~/.tmux/plugins/tpm/tpm'

# Barra de status adaptada à largura do cliente.
# O tmux renderiza a barra por cliente, então o mesmo servidor pode mostrar a
# barra completa no notebook e uma enxuta no celular ao mesmo tempo. Sem isso,
# numa tela estreita a direita ocupa tudo e a lista de janelas some.
#
# A captura tem que vir depois do tema (que monta o status-right no TPM), e a
# guarda evita capturar a própria condicional numa recarga de config.
run-shell 'case "$(tmux show-options -gv status-right)" in \
  *tn_right_full*) : ;; \
  *) tmux set -g @tn_right_full "$(tmux show-options -gv status-right)" ;; \
esac'
set -g @tn_right_short "#[fg=#394b70,bg=#292e42]#[none]#[fg=#ffffff,bg=#394b70] %H:%M #[none]"
# Comparacao ARITMETICA, nao textual: o operador < do tmux compara string, e
# "58" vem depois de "120" nessa ordem, o que quebra exatamente nas larguras de
# celular. Aqui subtraimos e testamos se o resultado e negativo.
set -g status-right "#{?#{m:-*,#{e|-:#{client_width},120}},#{E:@tn_right_short},#{E:@tn_right_full}}"

# Marca a janela ativa com um asterisco, em ASCII puro.
# O tema distingue ativa de inativa SO pela cor de fundo, e cliente que nao
# desenha fundo deixa as duas identicas: da pra ver as janelas, mas nao em
# qual voce esta. Foi o que apareceu no iPad, com o mosh do Termius.
# Lista de janelas adaptada a largura, igual o status-right.
#
# Os separadores do tema sao triangulos powerline: eles existem pra fazer a
# transicao entre dois fundos coloridos. Num cliente que nao desenha fundo,
# viram setas soltas no meio do texto, e a janela ativa fica indistinguivel
# das outras, porque o tema so a diferencia pela cor.
#
# Abaixo de 100 colunas trocamos por "*1:nome", que e legivel em qualquer
# cliente. Acima disso o tema fica como e.
run-shell 'case "$(tmux show-options -gv window-status-current-format)" in \
  *tn_win_cur*) : ;; \
  *) tmux set -g @tn_win_cur "$(tmux show-options -gv window-status-current-format)"; \
     tmux set -g @tn_win_nor "$(tmux show-options -gv window-status-format)" ;; \
esac'
set -g @tn_win_cur_plain "#[fg=#bb9af7,bold] *#I:#W #[none]"
set -g @tn_win_nor_plain "#[fg=#737aa2] #I:#W #[none]"
set -g window-status-current-format "#{?#{m:-*,#{e|-:#{client_width},100}},#{E:@tn_win_cur_plain},#{E:@tn_win_cur}}"
set -g window-status-format "#{?#{m:-*,#{e|-:#{client_width},100}},#{E:@tn_win_nor_plain},#{E:@tn_win_nor}}"
